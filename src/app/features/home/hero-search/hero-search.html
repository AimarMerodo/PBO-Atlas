<div class="relative mx-auto w-full max-w-md text-left">
  <div class="relative">
    <svg
      lucideSearch
      class="pointer-events-none absolute left-3.5 top-1/2 z-10 h-4 w-4 -translate-y-1/2 text-white/85 drop-shadow"
      aria-hidden="true"
    ></svg>
    <input
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (focus)="onFocus()"
      (keydown.enter)="onEnter()"
      [placeholder]="i18n.t('search.placeholder')"
      autocomplete="off"
      class="w-full rounded-xl border border-white/20 bg-black/40 py-3 pl-10 pr-4 text-sm text-white shadow-lg shadow-black/25 outline-none backdrop-blur placeholder:text-white/70 focus:border-accent/60 focus:bg-black/50"
    />
  </div>

  @if (open() && query().trim()) {
    <div
      class="absolute left-0 right-0 top-full z-30 mt-2 overflow-hidden rounded-xl border border-line bg-surface shadow-2xl"
    >
      <div class="max-h-[55vh] overflow-y-auto p-2">
        @if (!results().total) {
          <p class="px-3 py-4 text-sm text-ink-dim">{{ index() ? i18n.t("search.noResults") : "..." }}</p>
        }
        <app-search-results [results]="results()" (go)="go($event)" />
      </div>
    </div>
  }
</div>
