<div class="flex flex-wrap items-center justify-center gap-3 sm:justify-start">
  @for (f of forms(); track f.slug) {
    <a
      [routerLink]="['/pokedex', f.slug]"
      (mouseenter)="preload(f.slug)"
      (focus)="preload(f.slug)"
      class="group flex w-40 flex-col items-center rounded-2xl border border-line bg-surface p-4 transition-all hover:-translate-y-0.5 hover:border-accent/60"
    >
      <span
        class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide"
        [style]="kindStyle(f.kind)"
      >
        {{ kindLabel(f.kind) }}
      </span>
      @if (f.artwork) {
        <img
          [src]="f.artwork"
          [alt]="f.name"
          width="110"
          height="110"
          loading="lazy"
          class="mt-1 drop-shadow-md transition-transform duration-200 group-hover:scale-110"
        />
      } @else {
        <div class="mt-1 h-[110px] w-[110px]"></div>
      }
      <span class="mt-2 text-center text-sm font-semibold leading-tight">{{ f.name }}</span>
      @if (f.types.length > 0) {
        <span class="mt-1.5 flex gap-1">
          @for (t of f.types; track t) {
            <app-type-badge [type]="t" />
          }
        </span>
      }
    </a>
  }
</div>
