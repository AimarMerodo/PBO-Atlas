<div class="overflow-hidden rounded-xl border border-line">
  @for (row of rows(); track row.key; let i = $index) {
    <div
      [class]="
        'flex flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center ' + (i % 2 ? 'bg-surface-2/50' : 'bg-surface')
      "
    >
      <span class="w-36 shrink-0 text-sm font-semibold" [style.color]="row.accent">{{ i18n.t(row.label) }}</span>
      <span class="flex flex-wrap gap-1.5">
        @for (type of row.types; track type) {
          <app-type-badge [type]="type" />
        }
      </span>
    </div>
  }
</div>
