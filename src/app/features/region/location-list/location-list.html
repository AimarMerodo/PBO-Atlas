<div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
  @for (l of locations(); track l.id) {
    <a
      [routerLink]="['/region', region(), l.id]"
      class="flex items-center justify-between rounded-lg border border-line bg-surface px-4 py-3 transition-colors hover:border-accent/60"
    >
      <span class="text-sm font-medium">{{ l.name }}</span>
      <span class="whitespace-nowrap text-xs text-ink-dim">{{ l.speciesCount }} {{ i18n.t("region.species") }}</span>
    </a>
  }
</div>
