<header class="sticky top-0 z-40 border-b border-line bg-bg/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
    <a routerLink="/" class="flex shrink-0 items-center gap-2 whitespace-nowrap font-bold tracking-tight">
      <img src="/logo.png" alt="" aria-hidden="true" class="h-7 w-auto" />
      <span>PBO <span class="text-accent-soft">Atlas</span></span>
    </a>
    <nav class="flex items-center gap-1 text-sm text-ink-dim">
      <a routerLink="/regions" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.regions") }}
      </a>
      <a routerLink="/pokedex" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.pokedex") }}
      </a>
      <a routerLink="/items" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.items") }}
      </a>
      <a routerLink="/mounts" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.mounts") }}
      </a>
      <a routerLink="/cosmetics" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.cosmetics") }}
      </a>
      <a routerLink="/feedback" class="rounded-lg px-3 py-1.5 hover:bg-surface hover:text-ink transition-colors">
        {{ i18n.t("nav.feedback") }}
      </a>
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <app-search-trigger />
      <app-language-toggle />
    </div>
  </div>
</header>
