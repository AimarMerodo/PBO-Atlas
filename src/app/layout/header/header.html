<header class="sticky top-0 z-40 border-b border-line bg-bg/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
    <a routerLink="/" class="flex shrink-0 items-center gap-2 whitespace-nowrap font-bold tracking-tight" (click)="close()">
      <img src="/logo.png" alt="" aria-hidden="true" class="h-9 w-auto" />
      <span>PBO <span class="text-accent-soft">Atlas</span></span>
    </a>

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-1 text-sm text-ink-dim md:flex">
      @for (link of links; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="text-ink after:scale-x-100"
          [routerLinkActiveOptions]="{ exact: link.exact === true }"
          class="relative rounded-lg px-3 py-1.5 transition-colors hover:text-ink after:pointer-events-none after:absolute after:inset-x-3 after:bottom-0 after:h-0.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-accent after:transition-transform after:duration-200"
        >
          {{ i18n.t(link.label) }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2 sm:gap-3">
      <app-search-trigger />
      <app-language-toggle class="hidden md:flex" />
      <!-- Hamburger (mobile only) -->
      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-lg text-ink-dim transition-colors hover:bg-surface hover:text-ink md:hidden"
        (click)="toggle()"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-nav"
        [attr.aria-label]="i18n.t('nav.menu')"
      >
        @if (open()) {
          <svg lucideX class="h-5 w-5" aria-hidden="true"></svg>
        } @else {
          <svg lucideMenu class="h-5 w-5" aria-hidden="true"></svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile drawer -->
  @if (open()) {
    <nav id="mobile-nav" class="border-t border-line bg-bg px-2 py-2 md:hidden">
      @for (link of links; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="text-ink before:scale-y-100"
          [routerLinkActiveOptions]="{ exact: link.exact === true }"
          (click)="close()"
          class="relative block rounded-lg px-3 py-2.5 text-sm font-medium text-ink-dim transition-colors hover:bg-surface hover:text-ink before:absolute before:left-0 before:top-1/2 before:h-5 before:w-0.5 before:-translate-y-1/2 before:origin-center before:scale-y-0 before:rounded-full before:bg-accent before:transition-transform before:duration-200"
        >
          {{ i18n.t(link.label) }}
        </a>
      }
      <div class="mt-2 flex items-center justify-between gap-3 border-t border-line px-3 pt-3 pb-1">
        <span class="text-xs font-semibold uppercase tracking-wide text-ink-dim">{{ i18n.t("nav.language") }}</span>
        <app-language-toggle />
      </div>
    </nav>
  }
</header>
