@if (searchOpen()) {
  <div
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center pt-[12vh] px-4"
    (dismissOutside)="searchOpen.set(false)"
  >
    <div
      data-modal-content
      class="w-full max-w-lg rounded-xl border border-line bg-surface shadow-2xl overflow-hidden"
      role="dialog"
      aria-modal="true"
    >
      <input
        #queryInput
        [value]="query()"
        (input)="query.set(queryInput.value)"
        [placeholder]="i18n.t('search.placeholder')"
        class="w-full bg-transparent px-4 py-3 text-base outline-none border-b border-line placeholder:text-ink-dim"
      />
      <div class="max-h-[50vh] overflow-y-auto p-2">
        @if (query().trim() && !results().total) {
          <p class="px-3 py-4 text-sm text-ink-dim">
            {{ index() ? i18n.t("search.noResults") : "..." }}
          </p>
        }
        <app-search-results [results]="results()" (go)="go($event)" />
      </div>
    </div>
  </div>
}
