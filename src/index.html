<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PboAtlas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Self-hosted fonts: Anton (headlines) + Work Sans (body). Preload the
       latin subsets used above the fold; @font-face lives in styles.css. -->
  <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Prerendered HTML is always English; hide the app until Angular applies
    // the saved language (revealed in App, with a failsafe timeout).
    try {
      var l = localStorage.getItem("pbo-lang");
      if (l && l !== "en") document.documentElement.classList.add("lang-pending");
    } catch (e) {}
  </script>
  <style>
    html.lang-pending app-root { visibility: hidden; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
