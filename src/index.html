<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PboAtlas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Fonts: Anton (headlines) + Work Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <script>
    // Prerendered HTML is always English; hide the app until Angular applies
    // the saved language (revealed in App, with a failsafe timeout).
    try {
      var l = localStorage.getItem("pbo-lang");
      if (l && l !== "en") document.documentElement.classList.add("lang-pending");
    } catch (e) {}
  </script>
  <style>
    html.lang-pending app-root { visibility: hidden; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
